<mat-toolbar color="primary" class="app-toolbar">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    aria-label="Open navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title"><a href="/">Vienna Public Transport Accessibility</a></span>
  <span class="example-spacer"></span>

  <button matTooltip="Story Page" mat-icon-button routerLink="/story" aria-label="Open story">
    <mat-icon>auto_stories</mat-icon>
  </button>

  <button matTooltip="Interactive map" mat-icon-button routerLink="/map" aria-label="Open map">
    <mat-icon>map</mat-icon>
  </button>

  <button matTooltip="About page" mat-icon-button routerLink="/about" aria-label="Open about page">
    <mat-icon>info</mat-icon>
  </button>

  <button matTooltip="Share" mat-icon-button (click)="shareWebsite()" aria-label="Share website">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <button mat-menu-item routerLink="/story">
    <mat-icon>auto_stories</mat-icon>
    <span>Homepage / Story</span>
  </button>

  <button mat-menu-item routerLink="/map">
    <mat-icon>map</mat-icon>
    <span>Interactive map</span>
  </button>

  <button mat-menu-item routerLink="/about">
    <mat-icon>info</mat-icon>
    <span>Information</span>
  </button>
</mat-menu>

<div class="app-page">
  <router-outlet></router-outlet>
</div>
