<div class="chart-outer">
  <div class="chart-wrapper">
    <div #tooltip class="chart-tooltip"></div>

    <div #chartContainer class="chart-host"></div>

    <div class="chart-toolbar">
      <button
        type="button"
        [class.active]="viewMode === 'separate'"
        (click)="setViewMode('separate')">
        Separate
      </button>

      <button
        type="button"
        [class.active]="viewMode === 'total'"
        (click)="setViewMode('total')">
        Total
      </button>

      <button
        type="button"
        [class.active]="viewMode === 'pie'"
        (click)="setViewMode('pie')">
        Pie
      </button>
    </div>
  </div>
</div>
