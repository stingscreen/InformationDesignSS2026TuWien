<div class="chart-outer">
  <div class="chart-wrapper">
    <div #chartContainer class="chart-host"></div>

    <div class="chart-toolbar">
      <button
        type="button"
        [class.active]="viewMode === 'separate'"
        (click)="setViewMode('separate')">
        Separate
      </button>

      <button
        type="button"
        [class.active]="viewMode === 'average'"
        (click)="setViewMode('average')">
        Average
      </button>
    </div>
  </div>
</div>
